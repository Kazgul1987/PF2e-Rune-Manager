name: Build Foundry Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Read module version
        id: module
        run: |
          VERSION=$(jq -r '.version' module.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building PF2e Rune Manager v$VERSION"

      - name: Create release directory
        run: mkdir -p dist

      - name: Build module ZIP
        run: |
          zip -r "dist/pf2e-rune-manager.zip" \
            module.json \
            scripts \
            languages

      - name: Copy manifest
        run: cp module.json dist/module.json

      - name: Determine release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG=$(gh release view --json tagName --jq '.tagName')
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Uploading assets to release: $TAG"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.release.outputs.tag }}" \
            dist/pf2e-rune-manager.zip \
            dist/module.json \
            --clobber
